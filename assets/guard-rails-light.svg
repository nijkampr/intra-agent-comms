<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="Guard rails: name check, strict data gate, size cap, turn cap, STOP">
<title>Guard rails: name check, strict data gate, size cap, turn cap, STOP</title>
<style>
  .bg{fill:#FAFAF9} .card{fill:#FFFFFF;stroke:#E4E4E1;stroke-width:1}
  .soft{fill:rgba(34,136,188,0.10);stroke:#2288BC;stroke-width:1}
  .t{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#26272A} .d{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#5C5F66}
  .m{font-family:'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;fill:#26272A} .md{font-family:'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;fill:#5C5F66} .mb{font-family:'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;fill:#2288BC}
  .wire{fill:none;stroke:#5C5F66;stroke-opacity:.5;stroke-width:1.5}
  .flow{fill:none;stroke:#2288BC;stroke-width:1.5;stroke-dasharray:4 6;animation:dash 1.2s linear infinite}
  .dash{fill:none;stroke:#5C5F66;stroke-width:1;stroke-dasharray:3 4}
  .pkt{fill:#2288BC} .halo{fill:#2288BC;opacity:.25}
  @keyframes dash{to{stroke-dashoffset:-20}}
  @media (prefers-reduced-motion: reduce){ .flow{animation:none} .motion{display:none} }
</style>
<rect class="bg" x="0.5" y="0.5" width="959" height="299" rx="3" stroke="#E4E4E1" stroke-width="1"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5C5F66"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2288BC"/></marker></defs><text class="mb" x="40" y="44" font-size="14">{ guard rails }</text><text class="d" x="190" y="44" font-size="13">every post goes through the same gates, in this order</text><path class="wire" d="M40,128 H880"/><path class="wire" d="M40,218 H880"/><rect x="197" y="92" width="6" height="160" rx="2" fill="#E4E4E1"/><text class="m" x="200" y="80" font-size="13" text-anchor="middle">name</text><text class="d" x="200" y="276" font-size="11" text-anchor="middle">role@host</text><rect x="337" y="92" width="6" height="160" rx="2" fill="#E4E4E1"/><text class="m" x="340" y="80" font-size="13" text-anchor="middle">--strict</text><text class="d" x="340" y="276" font-size="11" text-anchor="middle">data gate</text><rect x="477" y="92" width="6" height="160" rx="2" fill="#E4E4E1"/><text class="m" x="480" y="80" font-size="13" text-anchor="middle">size</text><text class="d" x="480" y="276" font-size="11" text-anchor="middle">2 × 2000 chars</text><rect x="617" y="92" width="6" height="160" rx="2" fill="#E4E4E1"/><text class="m" x="620" y="80" font-size="13" text-anchor="middle">turns</text><text class="d" x="620" y="276" font-size="11" text-anchor="middle">≤ 20 per thread</text><rect x="757" y="92" width="6" height="160" rx="2" fill="#E4E4E1"/><text class="m" x="760" y="80" font-size="13" text-anchor="middle">STOP</text><text class="d" x="760" y="276" font-size="11" text-anchor="middle">closed stays closed</text><rect class="soft" x="880" y="108" width="56" height="40" rx="3"/><text class="mb" x="908.0" y="133.6" font-size="16" text-anchor="middle">✓</text><text class="d" x="908" y="168" font-size="11" text-anchor="middle">posted</text><g class="motion"><g><rect x="0" y="-15" width="112" height="30" rx="3" fill="#FFFFFF" stroke="#2288BC"/><text class="m" x="56" y="4" font-size="11" text-anchor="middle">→ bob@home · 3</text><animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" values="40 128; 40 128; 760 128; 760 128" keyTimes="0;.08;.72;1"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.08;.72;.78;1"/></g></g><g class="motion"><g><rect x="0" y="-15" width="112" height="30" rx="3" fill="#FFFFFF" stroke="#5C5F66" stroke-dasharray="3 3"/><text class="md" x="56" y="4" font-size="11" text-anchor="middle">IBAN NL91 ABNA…</text><animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" values="40 218; 40 218; 218 218; 218 218" keyTimes="0;.15;.4;1"/><animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;1;1;.35;.35;0" keyTimes="0;.15;.4;.48;.9;1"/></g><text class="mb" x="356" y="207" font-size="12" opacity="0">refused, not scrubbed<animate attributeName="opacity" dur="8s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.42;.46;.9;1"/></text></g><text class="md" x="40" y="108" font-size="11">a normal reply</text><text class="md" x="40" y="198" font-size="11">on a --strict machine</text>
</svg>
