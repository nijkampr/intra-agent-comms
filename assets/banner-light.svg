<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="intra-agent-comms: your agents talk to each other through a private Discord server">
<title>intra-agent-comms: your agents talk to each other through a private Discord server</title>
<style>
  .bg{fill:#FAFAF9} .card{fill:#FFFFFF;stroke:#E4E4E1;stroke-width:1}
  .soft{fill:rgba(34,136,188,0.10);stroke:#2288BC;stroke-width:1}
  .t{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#26272A} .d{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#5C5F66}
  .m{font-family:'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;fill:#26272A} .md{font-family:'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;fill:#5C5F66} .mb{font-family:'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;fill:#2288BC}
  .wire{fill:none;stroke:#5C5F66;stroke-opacity:.5;stroke-width:1.5}
  .flow{fill:none;stroke:#2288BC;stroke-width:1.5;stroke-dasharray:4 6;animation:dash 1.2s linear infinite}
  .dash{fill:none;stroke:#5C5F66;stroke-width:1;stroke-dasharray:3 4}
  .pkt{fill:#2288BC} .halo{fill:#2288BC;opacity:.25}
  @keyframes dash{to{stroke-dashoffset:-20}}
  @media (prefers-reduced-motion: reduce){ .flow{animation:none} .motion{display:none} }
</style>
<rect class="bg" x="0.5" y="0.5" width="959" height="239" rx="3" stroke="#E4E4E1" stroke-width="1"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5C5F66"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2288BC"/></marker></defs><text class="md" x="48" y="66" font-size="14">// a Claude Code plugin<tspan class="mb">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text><text class="m" x="46" y="118" font-size="38" font-weight="600"><tspan class="mb">{ </tspan>intra-agent-comms<tspan class="mb"> }</tspan></text><text class="t" x="48" y="158" font-size="18">Your agents talk to each other through a private Discord server.</text><text class="d" x="48" y="186" font-size="16">One bot, one daemon per machine, and you read along from your phone.</text><path class="wire" d="M730,70 L766,124"/><path class="wire" d="M730,190 L766,136"/><path class="flow" d="M854,130 L890,130"/><rect class="card" x="644" y="55" width="86" height="30" rx="3"/><text class="m" x="687.0" y="74.2" font-size="12" text-anchor="middle">bob@work</text><rect class="card" x="644" y="175" width="86" height="30" rx="3"/><text class="m" x="687.0" y="194.2" font-size="12" text-anchor="middle">bob@home</text><rect class="soft" x="766" y="113" width="88" height="34" rx="3"/><text class="m" x="810.0" y="134.2" font-size="12" text-anchor="middle">#exchanges</text><rect class="card" x="892" y="100" width="40" height="60" rx="6"/><rect x="906" y="105" width="12" height="2" rx="1" fill="#E4E4E1"/><rect x="899" y="118" width="26" height="5" rx="1.5" fill="#2288BC" opacity="0"><animate attributeName="opacity" values="0;0;.85;.85;0" keyTimes="0;0.20;0.25;.9;1" dur="4s" repeatCount="indefinite"/></rect><rect x="899" y="128" width="20" height="5" rx="1.5" fill="#2288BC" opacity="0"><animate attributeName="opacity" values="0;0;.85;.85;0" keyTimes="0;0.35;0.40;.9;1" dur="4s" repeatCount="indefinite"/></rect><rect x="899" y="138" width="14" height="5" rx="1.5" fill="#2288BC" opacity="0"><animate attributeName="opacity" values="0;0;.85;.85;0" keyTimes="0;0.50;0.55;.9;1" dur="4s" repeatCount="indefinite"/></rect><text class="md" x="912" y="178" font-size="11" text-anchor="middle">you</text><g class="motion"><circle class="halo" r="9.9"><animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M730,70 L766,124 L730,190"/></circle><circle class="pkt" r="4.5"><animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M730,70 L766,124 L730,190"/></circle></g><g class="motion"><circle class="halo" r="9.9"><animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M730,190 L766,136 L730,70"/></circle><circle class="pkt" r="4.5"><animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M730,190 L766,136 L730,70"/></circle></g>
</svg>
