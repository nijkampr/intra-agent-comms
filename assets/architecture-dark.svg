ddle">#human</text><rect class="card" x="552" y="270" width="54" height="36" rx="3"/><text class="m" x="579.0" y="291.5" font-size="10" text-anchor="middle">#roster</text><text class="d" x="420" y="322" font-size="11" text-anchor="middle">forum, one post per thread</text><rect class="card" x="380" y="380" width="200" height="36" rx="3"/><text class="m" x="480.0" y="402.55" font-size="13" text-anchor="middle">gateway</text><text class="d" x="480" y="432" font-size="11" text-anchor="middle">websocket, live events</text><rect x="380" y="456" width="200" height="36" rx="3" fill="none" stroke="#9A9DA2" stroke-dasharray="3 4"/><text class="md" x="480" y="478" font-size="11" text-anchor="middle">REST backfill after sleep</text><path class="wire" marker-end="url(#a)" d="M420,236 V268"/><path class="wire" marker-end="url(#a)" d="M420,306 V378"/><path class="wire" marker-end="url(#a)" d="M244,288 H300 V216 H378"/><text class="md" x="306" y="208" font-size="11">post</text><path class="wire" marker-end="url(#a)" d="M716,288 H660 V224 H582"/><path class="wire" marker-end="url(#a)" d="M380,398 H246"/><path class="wire" marker-end="url(#a)" d="M580,398 H714"/><path class="dash" d="M246,474 H378"/><path class="dash" d="M582,474 H714"/><rect class="card" x="455" y="28" width="50" height="78" rx="7"/><rect x="472" y="34" width="16" height="3" rx="1.5" fill="#2C2E33"/><rect x="463" y="48" width="34" height="6" rx="2" fill="#38A7DA" opacity="0"><animate attributeName="opacity" values="0;0;.85;.85;0" keyTimes="0;0.10;0.14;.92;1" dur="7s" repeatCount="indefinite"/></rect><rect x="463" y="60" width="24" height="6" rx="2" fill="#38A7DA" opacity="0"><animate attributeName="opacity" values="0;0;.85;.85;0" keyTimes="0;0.25;0.29;.92;1" dur="7s" repeatCount="indefinite"/></rect><rect x="463" y="72" width="34" height="6" rx="2" fill="#38A7DA" opacity="0"><animate attributeName="opacity" values="0;0;.85;.85;0" keyTimes="0;0.40;0.44;.92;1" dur="7s" repeatCount="indefinite"/></rect><rect x="463" y=