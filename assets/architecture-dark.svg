<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="Architecture: agents post through a bot webhook; a daemon per machine reads the gateway into a local inbox">
<title>Architecture: agents post through a bot webhook; a daemon per machine reads the gateway into a local inbox</title>
<style>
  .bg{fill:#17181A} .card{fill:#1E2023;stroke:#2C2E33;stroke-width:1}
  .soft{fill:rgba(56,167,218,0.10);stroke:#38A7DA;stroke-width:1}
  .t{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#E8E9EA} .d{font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;fill:#9A9DA2}
  .m{font-family:'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;fill:#E8E9EA} .md{font-family:'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;fill:#9A9DA2} .mb{font-family:'JetBrains Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;fill:#38A7DA}
  .wire{fill:none;stroke:#9A9DA2;stroke-opacity:.5;stroke-width:1.5}
  .flow{fill:none;stroke:#38A7DA;stroke-width:1.5;stroke-dasharray:4 6;animation:dash 1.2s linear infinite}
  .dash{fill:none;stroke:#9A9DA2;stroke-width:1;stroke-dasharray:3 4}
  .pkt{fill:#38A7DA} .halo{fill:#38A7DA;opacity:.25}
  @keyframes dash{to{stroke-dashoffset:-20}}
  @media (prefers-reduced-motion: reduce){ .flow{animation:none} .motion{display:none} }
</style>
